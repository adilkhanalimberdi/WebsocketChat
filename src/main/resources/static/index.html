<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>WebSocket Chat Application</title>
    <link rel="stylesheet" href="style/style.css">
<!--    <link rel="stylesheet" href="style/font.css">-->
</head>
<body>
    <div class="username-page">
        <div class="username-page-container">
            <h1 class="title">Type your username to enter the Chatroom</h1>

            <form id="usernameForm">
                <div class="form-group">
                    <label>
                        <input type="text" id="username-input" placeholder="Username..." autocomplete="off" class="form-control" />
                    </label>
                </div>

                <div class="form-group">
                    <button type="submit">Start Chatting</button>
                </div>
            </form>
        </div>
    </div>

    <div class="chat-page hidden">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Spring WebSocket Chat</h2>
            </div>

            <div class="connecting">
                Connecting...
            </div>

            <ul id="chat-history">

            </ul>

            <form id="messageForm">
                <div class="form-group">
                    <label>
                        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" class="form-control"/>
                    </label>
                    <button type="submit">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
